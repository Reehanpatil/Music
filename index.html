<script>
  (function () {
    var saved = localStorage.getItem('pd-theme');
    var theme = saved ? saved : 'light';
    if (theme === 'dark') document.documentElement.classList.add('dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<script>
  tailwind = { config: { darkMode: 'class', theme: { extend: {} } } };
</script>
<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF; --bg-elevated:#F6F5F3; --bg-card:#FFFFFF;
    --text:#221722; --text-muted:#8A7E85;
    --accent:#B5761F; --accent-2:#A83B4C; --border:rgba(34,23,34,0.10);
  }
  html.dark{
    --bg:#150E1B; --bg-elevated:#1E1526; --bg-card:#241A2D;
    --text:#F3E9D8; --text-muted:#B8A99B;
    --accent:#E3A63E; --accent-2:#D8657A; --border:rgba(243,233,216,0.09);
  }
  * { transition: background-color .35s ease, border-color .35s ease, color .35s ease; }
  body{ background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
  .font-display{ font-family:'Fraunces', serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }
  ::selection{ background: var(--accent); color:#150E1B; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .vinyl{
    background: repeating-radial-gradient(circle at center, #0c0710 0px, #0c0710 2px, #17101d 2px, #17101d 4px);
    box-shadow: inset 0 0 0 10px rgba(255,255,255,0.03), 0 20px 45px -15px rgba(0,0,0,0.45);
    animation: spin 4.5s linear infinite; animation-play-state: paused; cursor: pointer;
    position: relative;
  }
  .vinyl.spinning{ animation-play-state: running; }
  .vinyl-label{
    background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-2) 80%);
    overflow: hidden; position: relative;
  }
  .vinyl-label img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .tonearm{ transform-origin: 92% 8%; transform: rotate(-18deg); transition: transform .5s cubic-bezier(.4,0,.2,1); }
  .tonearm.active{ transform: rotate(2deg); }

  .eq-bar{ width: 3px; background: var(--accent); border-radius: 2px; height: 4px; animation: eq 900ms ease-in-out infinite; animation-play-state: paused; }
  .eq-bar.playing{ animation-play-state: running; }
  .eq-bar:nth-child(2){ animation-delay: .15s; }
  .eq-bar:nth-child(3){ animation-delay: .3s; }
  .eq-bar:nth-child(4){ animation-delay: .45s; }
  @keyframes eq{ 0%,100%{ height: 4px; } 50%{ height: 16px; } }

  #progressTrack{ background: var(--border); }
  #progressFill{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  .cat-pill{
    padding: 0.45rem 1.1rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
    border: 1px solid var(--border); color: var(--text-muted); background: var(--bg-card);
    cursor: pointer;
  }
  .cat-pill.active{ background: var(--accent); color:#150E1B; border-color: transparent; }
  .cat-pill:disabled{ opacity: 0.45; cursor: not-allowed; }

  #ytPlayerHost{ position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; bottom: 0; left: 0; }

  @media (prefers-reduced-motion: reduce){
    .vinyl, .eq-bar, .tonearm, *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>

<body class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-40 backdrop-blur-md border-b" style="background:color-mix(in srgb, var(--bg) 85%, transparent); border-color:var(--border);">
    <nav class="max-w-6xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
      <a href="#top" class="flex items-center gap-2.5 font-display text-lg sm:text-xl font-semibold tracking-tight">
        <svg width="30" height="30" viewBox="0 0 100 100" class="flex-shrink-0">
          <circle cx="50" cy="50" r="48" fill="#150E1B"/>
          <circle cx="50" cy="50" r="47" fill="none" style="stroke:var(--accent);" stroke-width="2" opacity="0.4"/>
          <circle cx="50" cy="50" r="34" fill="none" stroke="#382c44" stroke-width="1.5" opacity="0.7"/>
          <circle cx="50" cy="50" r="24" fill="none" stroke="#382c44" stroke-width="1.5" opacity="0.7"/>
          <circle cx="50" cy="50" r="15" style="fill:var(--accent);"/>
          <circle cx="50" cy="50" r="4" fill="#150E1B"/>
        </svg>
        Purani Dhun
      </a>
      <button id="themeToggle" aria-label="Toggle dark and light mode"
        class="h-10 w-10 rounded-full flex items-center justify-center border transition"
        style="border-color:var(--border); background:var(--bg-card);">
        <span id="themeIcon" class="text-base">🌙</span>
      </button>
    </nav>
  </header>

  <main id="top" class="flex-1 flex items-center justify-center px-5 py-10">
    <div class="flex flex-col items-center text-center gap-6">

      <!-- Station filter -->
      <div class="flex flex-wrap justify-center gap-2 px-2" id="catPills">
        <button class="cat-pill active" data-cat="songs">Songs</button>
        <button class="cat-pill" data-cat="naat">Naat</button>
        <button class="cat-pill" data-cat="qawali">Qawali</button>
      </div>

      <div class="relative flex justify-center items-center h-56 sm:h-80 max-w-full">
        <div id="vinyl" class="vinyl h-48 w-48 sm:h-72 sm:w-72 rounded-full flex items-center justify-center" role="button" aria-label="Play or pause">
          <div class="vinyl-label h-20 w-20 sm:h-24 sm:w-24 rounded-full flex items-center justify-center font-mono text-[10px] text-black/70">
            <img id="heroLabelImg" alt="" class="hidden" />
            <span id="heroLabelText">PD·45</span>
          </div>
        </div>
        <svg id="tonearm" class="tonearm absolute -top-2 right-2 sm:right-6 w-24 sm:w-32 h-24 sm:h-32" viewBox="0 0 100 100" fill="none">
          <circle cx="90" cy="10" r="7" fill="var(--text-muted)"/>
          <line x1="90" y1="10" x2="20" y2="70" stroke="var(--text-muted)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="20" cy="70" r="4" fill="var(--accent)"/>
        </svg>
      </div>

      <div>
        <p id="heroTitle" class="font-display text-xl sm:text-2xl font-semibold">Tap the record to play</p>
        <p id="heroArtist" class="text-sm mt-1" style="color:var(--text-muted);">—</p>
      </div>
    </div>
  </main>

  <div class="sticky bottom-0 z-50 border-t backdrop-blur-md" style="background:color-mix(in srgb, var(--bg) 92%, transparent); border-color:var(--border); padding-bottom:env(safe-area-inset-bottom);">
    <div class="max-w-6xl mx-auto px-3 sm:px-8 py-2.5 sm:py-3 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">

      <!-- Row 1 on mobile: track info + transport controls. Becomes two separate flex items on sm+ via sm:contents -->
      <div class="flex items-center justify-between gap-3 sm:contents">
        <div class="flex items-center gap-2.5 min-w-0 flex-1 sm:flex-none sm:w-56">
          <div id="miniVinyl" class="vinyl h-9 w-9 sm:h-10 sm:w-10 rounded-full flex-shrink-0 flex items-center justify-center">
            <div class="vinyl-label h-4 w-4 rounded-full">
              <img id="miniLabelImg" alt="" class="hidden" />
            </div>
          </div>
          <div class="min-w-0">
            <p id="nowTitle" class="text-sm font-semibold truncate">—</p>
            <p id="nowArtist" class="text-xs truncate" style="color:var(--text-muted);">—</p>
          </div>
        </div>

        <div class="flex items-center gap-2.5 sm:gap-4 flex-shrink-0">
          <button id="prevBtn" aria-label="Previous track" class="h-8 w-8 sm:h-9 sm:w-9 rounded-full flex items-center justify-center border" style="border-color:var(--border);">⏮</button>
          <button id="playBtn" aria-label="Play or pause" class="h-10 w-10 sm:h-11 sm:w-11 rounded-full flex items-center justify-center font-semibold" style="background:var(--accent); color:#150E1B;">▶</button>
          <button id="nextBtn" aria-label="Next track" class="h-8 w-8 sm:h-9 sm:w-9 rounded-full flex items-center justify-center border" style="border-color:var(--border);">⏭</button>
        </div>
      </div>

      <!-- Row 2 on mobile: progress bar. Sits inline on sm+ -->
      <div class="flex items-center gap-2.5 sm:gap-3 min-w-0 sm:flex-1">
        <span id="curTime" class="font-mono text-xs w-9 sm:w-10 text-right" style="color:var(--text-muted);">0:00</span>
        <div id="progressTrack" class="relative h-1.5 flex-1 rounded-full cursor-pointer overflow-hidden">
          <div id="progressFill" class="absolute left-0 top-0 h-full rounded-full" style="width:0%;"></div>
        </div>
        <span id="durTime" class="font-mono text-xs w-9 sm:w-10" style="color:var(--text-muted);">0:00</span>
      </div>

      <div class="hidden sm:flex items-end gap-1 h-4">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" class="hidden sm:block w-20" style="accent-color:var(--accent);" aria-label="Volume" />
    </div>
  </div>

  <div id="ytPlayerHost"><div id="ytPlayer"></div></div>

  <script>
    /* THEME TOGGLE — persisted in localStorage so it survives refresh */
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function applyThemeIcon(){ themeIcon.textContent = root.classList.contains('dark') ? '☀️' : '🌙'; }
    applyThemeIcon();
    themeToggle.addEventListener('click', () => {
      root.classList.toggle('dark');
      const theme = root.classList.contains('dark') ? 'dark' : 'light';
      localStorage.setItem('pd-theme', theme);
      root.setAttribute('data-theme', theme);
      applyThemeIcon();
    });

    /* ============================================================
       STATIONS — group videos into Songs / Naat / Qawali.
       Add your own YouTube video IDs to the empty arrays below.
       Get the ID from the URL: youtube.com/watch?v=THIS_PART
    ============================================================ */
    const stations = {
      songs: [
        { videoId: "9Ha8zX6H_qA" },
        { videoId: "wO7NBP1Ldl4" },
        { videoId: "LzXLcKbbDTw" },
        { videoId: "1eSG6dLiYxY" },
      ],
      naat: [
        // { videoId: "PASTE_ID_HERE" },
      ],
      qawali: [
        // { videoId: "PASTE_ID_HERE" },
      ],
    };

    let currentCategory = 'songs';
    let currentIndex = 0;
    let ytPlayer = null;
    let ytReady = false;
    let pendingPlay = false;
    let progressInterval = null;
    const titleCache = {};

    const ytScript = document.createElement('script');
    ytScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(ytScript);

    function onYouTubeIframeAPIReady(){
      ytPlayer = new YT.Player('ytPlayer', {
        height: '1', width: '1',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, modestbranding: 1, playsinline: 1 },
        events: {
          onReady: () => {
            ytReady = true;
            cueTrack(0, false);
            if (pendingPlay) { pendingPlay = false; ytPlayer.playVideo(); }
          },
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    function onPlayerError(e){
      const reasons = {
        2: "Invalid video", 5: "Playback error",
        100: "Video not found or removed",
        101: "Owner disabled embedding for this video",
        150: "Owner disabled embedding for this video"
      };
      heroTitle.textContent = (reasons[e.data] || "Couldn't play this video") + " — skipping…";
      setTimeout(() => cueTrack(currentIndex + 1, true), 1200);
    }

    const catPills = document.querySelectorAll('.cat-pill');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const nowTitle = document.getElementById('nowTitle');
    const nowArtist = document.getElementById('nowArtist');
    const heroTitle = document.getElementById('heroTitle');
    const heroArtist = document.getElementById('heroArtist');
    const heroLabelImg = document.getElementById('heroLabelImg');
    const heroLabelText = document.getElementById('heroLabelText');
    const miniLabelImg = document.getElementById('miniLabelImg');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const curTimeEl = document.getElementById('curTime');
    const durTimeEl = document.getElementById('durTime');
    const volumeEl = document.getElementById('volume');
    const eqBars = document.querySelectorAll('.eq-bar');
    const vinylEls = document.querySelectorAll('.vinyl');
    const tonearm = document.getElementById('tonearm');

    function formatTime(sec){
      if (!isFinite(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    /* Fetch real title/artist/thumbnail for a video — free, no API key (YouTube oEmbed) */
    async function fetchMeta(videoId){
      if (titleCache[videoId]) return titleCache[videoId];
      try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
        if (!res.ok) throw new Error('oEmbed failed');
        const data = await res.json();
        const meta = { title: data.title, artist: data.author_name, thumb: data.thumbnail_url };
        titleCache[videoId] = meta;
        return meta;
      } catch (e) {
        return { title: "Unknown title", artist: "", thumb: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` };
      }
    }

    function setLabelImage(url){
      [heroLabelImg, miniLabelImg].forEach(img => {
        img.src = url;
        img.classList.remove('hidden');
      });
      heroLabelText.classList.add('hidden');
    }

    function setEmptyStation(){
      nowTitle.textContent = "—"; nowArtist.textContent = "—";
      heroTitle.textContent = "No tracks in this station yet";
      heroArtist.textContent = "Add YouTube video IDs in the code to enable it";
      [heroLabelImg, miniLabelImg].forEach(img => img.classList.add('hidden'));
      heroLabelText.classList.remove('hidden');
    }

    async function cueTrack(index, autoplay){
      const list = stations[currentCategory];
      if (!list.length) { setEmptyStation(); return; }
      currentIndex = ((index % list.length) + list.length) % list.length;
      const track = list[currentIndex];

      nowTitle.textContent = "Loading…"; heroTitle.textContent = "Loading…"; heroArtist.textContent = "—";

      if (ytReady) {
        if (autoplay) ytPlayer.loadVideoById(track.videoId);
        else ytPlayer.cueVideoById(track.videoId);
      }

      const meta = await fetchMeta(track.videoId);
      nowTitle.textContent = meta.title; nowArtist.textContent = meta.artist;
      heroTitle.textContent = meta.title; heroArtist.textContent = meta.artist;
      if (meta.thumb) setLabelImage(meta.thumb);
    }

    function switchCategory(cat){
      if (cat === currentCategory) return;
      const wasPlaying = ytReady && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING;
      currentCategory = cat;
      currentIndex = 0;
      catPills.forEach(p => p.classList.toggle('active', p.dataset.cat === cat));
      cueTrack(0, wasPlaying);
    }
    catPills.forEach(p => p.addEventListener('click', () => switchCategory(p.dataset.cat)));

    function setPlayingUI(isPlaying){
      playBtn.textContent = isPlaying ? '⏸' : '▶';
      vinylEls.forEach(v => v.classList.toggle('spinning', isPlaying));
      tonearm.classList.toggle('active', isPlaying);
      eqBars.forEach(b => b.classList.toggle('playing', isPlaying));
    }

    function onPlayerStateChange(e){
      if (e.data === YT.PlayerState.PLAYING){
        setPlayingUI(true);
        durTimeEl.textContent = formatTime(ytPlayer.getDuration());
        if (!progressInterval) progressInterval = setInterval(updateProgress, 500);
      } else if (e.data === YT.PlayerState.PAUSED){
        setPlayingUI(false);
      } else if (e.data === YT.PlayerState.ENDED){
        setPlayingUI(false);
        cueTrack(currentIndex + 1, true);
      }
    }

    function updateProgress(){
      if (!ytPlayer || !ytPlayer.getDuration) return;
      const dur = ytPlayer.getDuration();
      const cur = ytPlayer.getCurrentTime();
      curTimeEl.textContent = formatTime(cur);
      durTimeEl.textContent = formatTime(dur);
      progressFill.style.width = dur ? ((cur / dur) * 100) + '%' : '0%';
    }

    function togglePlay(){
      if (!stations[currentCategory].length) return;
      if (!ytReady) { pendingPlay = true; return; }
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    }

    playBtn.addEventListener('click', togglePlay);
    document.getElementById('vinyl').addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', () => cueTrack(currentIndex - 1, true));
    nextBtn.addEventListener('click', () => cueTrack(currentIndex + 1, true));

    progressTrack.addEventListener('click', (e) => {
      if (!ytReady) return;
      const rect = progressTrack.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      const dur = ytPlayer.getDuration();
      if (dur) ytPlayer.seekTo(pct * dur, true);
    });

    volumeEl.addEventListener('input', () => { if (ytReady) ytPlayer.setVolume(volumeEl.value * 100); });

    /* Keep playing in background — never pause on tab visibility change */
    document.addEventListener('visibilitychange', () => {});
  </script>
</body>
</html>
