<style>
  :root{
    --bg:#FFFFFF; --bg-elevated:#F6F5F3; --bg-card:#FFFFFF;
    --text:#221722; --text-muted:#8A7E85;
    --accent:#B5761F; --accent-2:#A83B4C; --border:rgba(34,23,34,0.10);
  }
  html.dark{
    --bg:#150E1B; --bg-elevated:#1E1526; --bg-card:#241A2D;
    --text:#F3E9D8; --text-muted:#B8A99B;
    --accent:#E3A63E; --accent-2:#D8657A; --border:rgba(243,233,216,0.09);
  }
  * { transition: background-color .35s ease, border-color .35s ease, color .35s ease; }
  body{ background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
  .font-display{ font-family:'Fraunces', serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }
  ::selection{ background: var(--accent); color:#150E1B; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .vinyl{
    background: repeating-radial-gradient(circle at center, #0c0710 0px, #0c0710 2px, #17101d 2px, #17101d 4px);
    box-shadow: inset 0 0 0 10px rgba(255,255,255,0.03), 0 20px 45px -15px rgba(0,0,0,0.45);
    animation: spin 4.5s linear infinite; animation-play-state: paused; cursor: pointer;
    position: relative;
  }
  .vinyl.spinning{ animation-play-state: running; }
  .vinyl-label{
    background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-2) 80%);
    overflow: hidden; position: relative;
  }
  .vinyl-label img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .tonearm{ transform-origin: 92% 8%; transform: rotate(-18deg); transition: transform .5s cubic-bezier(.4,0,.2,1); }
  .tonearm.active{ transform: rotate(2deg); }

  .eq-bar{ width: 3px; background: var(--accent); border-radius: 2px; height: 4px; animation: eq 900ms ease-in-out infinite; animation-play-state: paused; }
  .eq-bar.playing{ animation-play-state: running; }
  .eq-bar:nth-child(2){ animation-delay: .15s; }
  .eq-bar:nth-child(3){ animation-delay: .3s; }
  .eq-bar:nth-child(4){ animation-delay: .45s; }
  @keyframes eq{ 0%,100%{ height: 4px; } 50%{ height: 16px; } }

  #progressTrack{ background: var(--border); }
  #progressFill{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  #ytPlayerHost{ position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; bottom: 0; left: 0; }

  @media (prefers-reduced-motion: reduce){
    .vinyl, .eq-bar, .tonearm, *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>

    /* Install prompt (Android/desktop Chrome) */
    let deferredInstallEvent = null;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallEvent = e;
      if (installBtn) installBtn.classList.remove('hidden');
    });
    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredInstallEvent) return;
        deferredInstallEvent.prompt();
        await deferredInstallEvent.userChoice;
        deferredInstallEvent = null;
        installBtn.classList.add('hidden');
      });
    }
    window.addEventListener('appinstalled', () => { if (installBtn) installBtn.classList.add('hidden'); });

    /* THEME TOGGLE — persisted in localStorage so it survives refresh */
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const iconMoon = document.getElementById('iconMoon');
    const iconSun = document.getElementById('iconSun');
    function applyThemeIcon(){
      const isDark = root.classList.contains('dark');
      iconMoon.classList.toggle('hidden', isDark);   // show moon when currently light (tap to go dark)
      iconSun.classList.toggle('hidden', !isDark);   // show sun when currently dark (tap to go light)
    }
    applyThemeIcon();
    themeToggle.addEventListener('click', () => {
      root.classList.toggle('dark');
      const theme = root.classList.contains('dark') ? 'dark' : 'light';
      localStorage.setItem('pd-theme', theme);
      root.setAttribute('data-theme', theme);
      applyThemeIcon();
    });

    /* ============================================================
       PLAYLIST — add as many songs as you like below.
       Get each video's ID from its YouTube URL: youtube.com/watch?v=THIS_PART
    ============================================================ */
    const playlist = [
      { videoId: "9Ha8zX6H_qA" },
      { videoId: "wO7NBP1Ldl4" },
      { videoId: "LzXLcKbbDTw" },
      { videoId: "1eSG6dLiYxY" },
      // Add more songs here — just copy the line above and paste your own videoId.
      // { videoId: "PASTE_ID_HERE" },
    ];

    let currentIndex = 0;
    let ytPlayer = null;
    let ytReady = false;
    let pendingPlay = false;
    let progressInterval = null;
    const titleCache = {};

    const ytScript = document.createElement('script');
    ytScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(ytScript);

    function onYouTubeIframeAPIReady(){
      ytPlayer = new YT.Player('ytPlayer', {
        height: '1', width: '1',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, modestbranding: 1, playsinline: 1 },
        events: {
          onReady: () => {
            ytReady = true;
            cueTrack(0, false);
            if (pendingPlay) { pendingPlay = false; ytPlayer.playVideo(); }
          },
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    function onPlayerError(e){
      const reasons = {
        2: "Invalid video", 5: "Playback error",
        100: "Video not found or removed",
        101: "Owner disabled embedding for this video",
        150: "Owner disabled embedding for this video"
      };
      heroTitle.textContent = (reasons[e.data] || "Couldn't play this video") + " — skipping…";
      setTimeout(() => cueTrack(currentIndex + 1, true), 1200);
    }

    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const nowTitle = document.getElementById('nowTitle');
    const nowArtist = document.getElementById('nowArtist');
    const heroTitle = document.getElementById('heroTitle');
    const heroArtist = document.getElementById('heroArtist');
    const heroLabelImg = document.getElementById('heroLabelImg');
    const heroLabelText = document.getElementById('heroLabelText');
    const miniLabelImg = document.getElementById('miniLabelImg');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const curTimeEl = document.getElementById('curTime');
    const durTimeEl = document.getElementById('durTime');
    const volumeEl = document.getElementById('volume');
    const muteBtn = document.getElementById('muteBtn');
    const iconVolOn = document.getElementById('iconVolOn');
    const iconVolOff = document.getElementById('iconVolOff');
    const eqBars = document.querySelectorAll('.eq-bar');
    const vinylEls = document.querySelectorAll('.vinyl');
    const tonearm = document.getElementById('tonearm');

    function formatTime(sec){
      if (!isFinite(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    /* Fetch real title/artist/thumbnail for a video — free, no API key (YouTube oEmbed) */
    async function fetchMeta(videoId){
      if (titleCache[videoId]) return titleCache[videoId];
      try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
        if (!res.ok) throw new Error('oEmbed failed');
        const data = await res.json();
        const meta = { title: data.title, artist: data.author_name, thumb: data.thumbnail_url };
        titleCache[videoId] = meta;
        return meta;
      } catch (e) {
        return { title: "Unknown title", artist: "", thumb: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg` };
      }
    }

    function setLabelImage(url){
      [heroLabelImg, miniLabelImg].forEach(img => {
        img.src = url;
        img.classList.remove('hidden');
      });
      heroLabelText.classList.add('hidden');
    }

    function setEmptyPlaylist(){
      nowTitle.textContent = "—"; nowArtist.textContent = "—";
      heroTitle.textContent = "No songs yet";
      heroArtist.textContent = "Add YouTube video IDs in the code to enable playback";
      [heroLabelImg, miniLabelImg].forEach(img => img.classList.add('hidden'));
      heroLabelText.classList.remove('hidden');
    }

    async function cueTrack(index, autoplay){
      if (!playlist.length) { setEmptyPlaylist(); return; }
      currentIndex = ((index % playlist.length) + playlist.length) % playlist.length;
      const track = playlist[currentIndex];

      nowTitle.textContent = "Loading…"; heroTitle.textContent = "Loading…"; heroArtist.textContent = "—";

      if (ytReady) {
        if (autoplay) ytPlayer.loadVideoById(track.videoId);
        else ytPlayer.cueVideoById(track.videoId);
      }

      const meta = await fetchMeta(track.videoId);
      nowTitle.textContent = meta.title; nowArtist.textContent = meta.artist;
      heroTitle.textContent = meta.title; heroArtist.textContent = meta.artist;
      if (meta.thumb) setLabelImage(meta.thumb);
      updateMediaSession(meta);
    }

    /* ============================================================
       LOCK-SCREEN CONTROLS — Media Session API (free, built into
       browsers). Shows title/artist/artwork on the phone's lock
       screen & notification, and wires up hardware/earphone buttons.
    ============================================================ */
    function updateMediaSession(meta){
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: meta.title || 'Purani Dhun',
        artist: meta.artist || 'Purani Dhun Radio',
        album: 'Purani Dhun',
        artwork: meta.thumb ? [
          { src: meta.thumb, sizes: '96x96', type: 'image/jpeg' },
          { src: meta.thumb, sizes: '256x256', type: 'image/jpeg' },
          { src: meta.thumb, sizes: '512x512', type: 'image/jpeg' },
        ] : []
      });
    }

    function setupMediaSessionActions(){
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.setActionHandler('play', () => { if (ytReady) ytPlayer.playVideo(); });
      navigator.mediaSession.setActionHandler('pause', () => { if (ytReady) ytPlayer.pauseVideo(); });
      navigator.mediaSession.setActionHandler('previoustrack', () => cueTrack(currentIndex - 1, true));
      navigator.mediaSession.setActionHandler('nexttrack', () => cueTrack(currentIndex + 1, true));
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (ytReady && details.seekTime != null) ytPlayer.seekTo(details.seekTime, true);
      });
    }
    setupMediaSessionActions();

    function setPlayingUI(isPlaying){
      playBtn.textContent = isPlaying ? '⏸' : '▶';
      vinylEls.forEach(v => v.classList.toggle('spinning', isPlaying));
      tonearm.classList.toggle('active', isPlaying);
      eqBars.forEach(b => b.classList.toggle('playing', isPlaying));
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
    }

    function onPlayerStateChange(e){
      if (e.data === YT.PlayerState.PLAYING){
        setPlayingUI(true);
        durTimeEl.textContent = formatTime(ytPlayer.getDuration());
        if (!progressInterval) progressInterval = setInterval(updateProgress, 500);
      } else if (e.data === YT.PlayerState.PAUSED){
        setPlayingUI(false);
      } else if (e.data === YT.PlayerState.ENDED){
        setPlayingUI(false);
        cueTrack(currentIndex + 1, true);
      }
    }

    function updateProgress(){
      if (!ytPlayer || !ytPlayer.getDuration) return;
      const dur = ytPlayer.getDuration();
      const cur = ytPlayer.getCurrentTime();
      curTimeEl.textContent = formatTime(cur);
      durTimeEl.textContent = formatTime(dur);
      progressFill.style.width = dur ? ((cur / dur) * 100) + '%' : '0%';
      if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession && dur > 0) {
        try { navigator.mediaSession.setPositionState({ duration: dur, playbackRate: 1, position: Math.min(cur, dur) }); } catch (e) {}
      }
    }

    function togglePlay(){
      if (!playlist.length) return;
      if (!ytReady) { pendingPlay = true; return; }
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    }

    playBtn.addEventListener('click', togglePlay);
    document.getElementById('vinyl').addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', () => cueTrack(currentIndex - 1, true));
    nextBtn.addEventListener('click', () => cueTrack(currentIndex + 1, true));

    progressTrack.addEventListener('click', (e) => {
      if (!ytReady) return;
      const rect = progressTrack.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      const dur = ytPlayer.getDuration();
      if (dur) ytPlayer.seekTo(pct * dur, true);
    });

    volumeEl.addEventListener('input', () => {
      if (ytReady) ytPlayer.setVolume(volumeEl.value * 100);
      const muted = parseFloat(volumeEl.value) === 0;
      iconVolOn.classList.toggle('hidden', muted);
      iconVolOff.classList.toggle('hidden', !muted);
      if (!muted) lastVolume = volumeEl.value;
    });

    let lastVolume = volumeEl.value;
    muteBtn.addEventListener('click', () => {
      const isMuted = iconVolOff.classList.contains('hidden') === false;
      if (isMuted) {
        volumeEl.value = lastVolume || 0.8;
      } else {
        lastVolume = volumeEl.value;
        volumeEl.value = 0;
      }
      volumeEl.dispatchEvent(new Event('input'));
    });

    /* Keep playing in background — never pause on tab visibility change */
    document.addEventListener('visibilitychange', () => {});
  </script>
</body>
</html>
